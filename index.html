<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALOPAK</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="slider.css">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a href="#" class="logo-wrap" aria-label="ALOPAK početna">
                <div class="logo-img"></div>
            </a>

            <button class="burger-btn" id="burgerBtn" aria-label="Otvori meni">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-holder">
                <ul class="nav-menu" id="navMenu">

                    <li class="nav-item">
                        <a href="#" class="nav-link">Početna</a>
                    </li>

                    <li class="nav-item has-dropdown">
                        <a class="nav-link dropdown-toggle">PP trake</a>
                        <ul class="dropdown-menu">
                            <li><a href="#">Proizvod 1</a></li>
                            <li><a href="#">Proizvod 2</a></li>
                        </ul>
                    </li>

                    <li class="nav-item has-dropdown">
                        <a class="nav-link dropdown-toggle">PET trake</a>
                        <ul class="dropdown-menu">
                            <li><a href="#">Proizvod 1</a></li>
                            <li><a href="#">Proizvod 2</a></li>
                        </ul>
                    </li>

                    <li class="nav-item has-dropdown">
                        <a class="nav-link dropdown-toggle">Spojnice</a>
                        <ul class="dropdown-menu">
                            <li><a href="#">Proizvod 1</a></li>
                            <li><a href="#">Proizvod 2</a></li>
                        </ul>
                    </li>

                    <li class="nav-item has-dropdown">
                        <a class="nav-link dropdown-toggle">Alati</a>

                        <ul class="dropdown-menu">
                            <li><a href="#">Proizvod 1</a></li>
                            <li><a href="#">Proizvod 2</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link">Dispenzeri</a>
                    </li>

                    <li class="nav-item has-dropdown">
                        <a class="nav-link dropdown-toggle">Mašine</a>

                        <ul class="dropdown-menu">
                            <li><a href="#">Proizvod 1</a></li>
                            <li><a href="#">Proizvod 2</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link contact-btn">Kontakt</a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>

    <section class="slider">
        <div class="slider-track" id="sliderTrack">

            <div class="slider-item">
                <img src="images/img1.png" alt="Slika 1">
            </div>

            <div class="slider-item">
                <img src="images/img2.png" alt="Slika 2">
            </div>

            <div class="slider-item">
                <img src="images/img3.png" alt="Slika 3">
            </div>

            <div class="slider-item">
                <img src="images/img4.png" alt="Slika 4">
            </div>

            <div class="slider-item">
                <img src="images/img5.png" alt="Slika 5">
            </div>

            <div class="slider-item">
                <img src="images/img6.png" alt="Slika 6">
            </div>

        </div>

        <button class="slider-btn slider-btn-left" id="prevBtn">&#10094;</button>
        <button class="slider-btn slider-btn-right" id="nextBtn">&#10095;</button>

        <div class="slider-dots">
            <button class="slider-dot active" data-index="0"></button>
            <button class="slider-dot" data-index="1"></button>
            <button class="slider-dot" data-index="2"></button>
            <button class="slider-dot" data-index="3"></button>
            <button class="slider-dot" data-index="4"></button>
            <button class="slider-dot" data-index="5"></button>
        </div>
    </section>

    <script src="navbarScript.js"></script>
    <script src="sliderScript.js"></script>
</body>

</html>
